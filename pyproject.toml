[project]
name = "ai-rag-infra"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Volodymyr Lopukhovych", email = "volodymyr.l@btigroup.io" }
]
requires-python = ">=3.13"
dependencies = [
    "aws-cdk-lib>=2.277.0",
    "boto3>=1.44.6",
    "cdk-nag>=2.36,<3",
    "constructs>=10.8.1",
]

[project.scripts]
ai-rag-infra = "ai_rag_infra:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
